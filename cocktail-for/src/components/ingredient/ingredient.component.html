<!-- Error message -->
<div *ngIf="errorMessage" class="error-message">
  {{ errorMessage }}
</div>

<!-- Main content -->
<div class="ingredient-container" *ngIf="cocktails && !errorMessage">
  <h1>{{ cocktails.strDrink }}</h1>
  <img [src]="cocktails.strDrinkThumb" alt="Drink Image">
  <h2>Ingredients</h2>
  <ul>
    <li *ngFor="let item of ingredients">
      {{ item.ingredient }} - {{ item.measure }}
    </li>
  </ul>
</div>
